<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demo Hub-and-Spoke</title>
  <link rel="stylesheet" href="/assets/style.css">
  <script defer src="/assets/app.js"></script>
</head>
<body>
<main>
  <h1>Demo Hub-and-Spoke</h1>
  <div class="workspace">
    <form id="demo-form" class="panel">
      <h2>Đầu vào</h2>
      <label for="request">Mô tả yêu cầu</label>
      <textarea id="request" rows="7" required minlength="20" maxlength="10000" placeholder="Ví dụ: Viết hàm validate_email(email) để kiểm tra email sinh viên…"></textarea>
      <p class="muted">Demo xử lý yêu cầu viết hoặc sửa một hàm Python <code>validate_email(email)</code>.</p>
      <div class="actions">
        <button type="button" class="link" id="sample-request">Điền yêu cầu mẫu</button>
        <button type="button" class="link" id="sample-code">Thử mã có secret giả</button>
      </div>
      <details id="code-options">
        <summary>Mã Python có sẵn (tùy chọn)</summary>
        <label for="initial-code">Mã cần kiểm tra hoặc sửa</label>
        <textarea id="initial-code" rows="7" maxlength="12000" spellcheck="false" placeholder="Để trống nếu muốn Developer viết mã mới."></textarea>
      </details>
      <button type="submit" id="next">Chạy yêu cầu</button>
      <p id="connection" class="muted" role="status"></p>
    </form>
    <section class="panel" aria-labelledby="result-heading">
      <h2 id="result-heading">Đầu ra</h2>
      <p id="status" role="status">Kết quả sẽ xuất hiện sau khi chạy yêu cầu.</p>
      <p id="error" role="alert" hidden></p>
      <div id="output"></div>
      <details class="history" id="history-panel" hidden>
        <summary>Nhật ký xử lý</summary>
        <ol id="history"></ol>
        <p id="usage" class="muted"></p>
        <button type="button" class="link" id="export">Tải kết quả phiên JSON</button>
      </details>
      <button type="button" id="accept" hidden>Chấp nhận kết quả</button>
    </section>
  </div>
</main>
</body>
</html>
