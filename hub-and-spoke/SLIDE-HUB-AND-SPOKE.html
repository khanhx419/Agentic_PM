>03 · NHẬN KẾT QUẢ</span><h3>Chuyển sang QA</h3><p>“Solution complete” trong hình là xong bước triển khai, chưa phải story được phê duyệt.</p></section></aside></div>\n</div><footer class=\"source-note\">Nguồn: <a href=\"../Bo-thuyet-trinh/01-Hub-and-Spoke/tai-lieu-goc.pdf#page=65\" target=\"_blank\" rel=\"noopener\">Muhammad Awais (2026), tr. 65 (Hình 3.4), 99–101</a></footer></article>", "<article><header><h2>QA: lỗi phải quay lại đúng người thực hiện</h2><p class=\"lead\">Kiểm thử và phân tích mã cung cấp kết quả PASS/FAIL cùng phản hồi cho vòng sửa lỗi.</p></header><div class=\"content\"><svg class=\"engineering\" viewBox=\"0 0 1312 540\" role=\"img\" aria-label=\"Developer nộp mã và tests cho QA. QA FAIL có feedback qua Coordinator quay về Developer để sửa và nộp lại.\"><defs><marker id=\"tip\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"8\" markerHeight=\"8\" orient=\"auto-start-reverse\"><path d=\"M0 0 L10 5 L0 10 Z\" fill=\"context-stroke\"/></marker></defs><rect x=\"40\" y=\"115\" width=\"290\" height=\"125\" rx=\"9\" fill=\"#f3f6fa\" stroke=\"#a9bdd3\" stroke-width=\"2\"/><text x=\"185.0\" y=\"150\" text-anchor=\"middle\" fill=\"#17253b\" font-size=\"24\" font-weight=\"700\"><tspan x=\"185.0\" dy=\"0\">Frontend / Backend</tspan><tspan x=\"185.0\" dy=\"33\">Developer</tspan></text><text x=\"185.0\" y=\"218\" text-anchor=\"middle\" fill=\"#58677a\" font-size=\"21\" font-weight=\"500\"><tspan x=\"185.0\" dy=\"0\">Code + tests</tspan></text><rect x=\"460\" y=\"115\" width=\"280\" height=\"125\" rx=\"9\" fill=\"#eaf2fb\" stroke=\"#245b99\" stroke-width=\"2\"/><text x=\"600.0\" y=\"150\" text-anchor=\"middle\" fill=\"#17253b\" font-size=\"24\" font-weight=\"700\"><tspan x=\"600.0\" dy=\"0\">QA Agent</tspan></text><text x=\"600.0\" y=\"218\" text-anchor=\"middle\" fill=\"#58677a\" font-size=\"21\" font-weight=\"500\"><tspan x=\"600.0\" dy=\"0\">Tests / static analysis</tspan></text><rect x=\"915\" y=\"115\" width=\"350\" height=\"125\" rx=\"9\" fill=\"#edf8f3\" stroke=\"#529b7c\" stroke-width=\"2\"/><text x=\"1090.0\" y=\"150\" text-anchor=\"middle\" fill=\"#17253b\" font-size=\"24\" font-weight=\"700\"><tspan x=\"1090.0\" dy=\"0\">QA PASS</tspan></text><text x=\"1090.0\" y=\"218\" text-anchor=\"middle\" fill=\"#58677a\" font-size=\"21\" font-weight=\"500\"><tspan x=\"1090.0\" dy=\"0\">Sang bước kế tiếp</tspan></text><path d=\"M330 177 H460\" fill=\"none\" stroke=\"#245b99\" stroke-width=\"2.5\" marker-end=\"url(#tip)\"/><text x=\"395\" y=\"152\" text-anchor=\"middle\" fill=\"#245b99\" font-size=\"20\" font-weight=\"500\"><tspan x=\"395\" dy=\"0\">Submit</tspan></text><path d=\"M740 177 H915\" fill=\"none\" stroke=\"#0f766e\" stroke-width=\"2.5\" marker-end=\"url(#tip)\"/><text x=\"828\" y=\"152\" text-anchor=\"middle\" fill=\"#0f766e\" font-size=\"20\" font-weight=\"500\"><tspan x=\"828\" dy=\"0\">PASS</tspan></text><rect x=\"460\" y=\"365\" width=\"280\" height=\"115\" rx=\"9\" fill=\"#fff2ef\" stroke=\"#bd7770\" stroke-width=\"2\"/><text x=\"600.0\" y=\"400\" text-anchor=\"middle\" fill=\"#17253b\" font-size=\"24\" font-weight=\"700\"><tspan x=\"600.0\" dy=\"0\">QA_FAIL + feedback</tspan></text><text x=\"600.0\" y=\"458\" text-anchor=\"middle\" fill=\"#58677a\" font-size=\"21\" font-weight=\"500\"><tspan x=\"600.0\" dy=\"0\">Danh sách lỗi</tspan></text><path d=\"M600 240 V365\" fill=\"none\" stroke=\"#a4453d\" stroke-width=\"2.5\" marker-end=\"url(#tip)\"/><text x=\"638\" y=\"309\" text-anchor=\"middle\" fill=\"#a4453d\" font-size=\"20\" font-weight=\"500\"><tspan x=\"638\" dy=\"0\">FAIL</tspan></text><path d=\"M460 422 H185 V240\" fill=\"none\" stroke=\"#a4453d\" stroke-width=\"2.5\" marker-end=\"url(#tip)\"/><text x=\"272\" y=\"468\" text-anchor=\"middle\" fill=\"#a4453d\" font-size=\"20\" font-weight=\"500\"><tspan x=\"272\" dy=\"0\">Coordinator trả đúng Developer để sửa</tspan></text><text x=\"1090\" y=\"295\" text-anchor=\"middle\" fill=\"#0f766e\" font-size=\"23\" font-weight=\"500\"><tspan x=\"1090\" dy=\"0\">BASIC / STRICT:</tspan><tspan x=\"1090\" dy=\"33\">tiếp tục Governance</tspan></text><text x=\"1090\" y=\"389\" text-anchor=\"middle\" fill=\"#58677a\" font-size=\"23\" font-weight=\"500\"><tspan x=\"1090\" dy=\"0\">OFF theo bảng kết quả:</tspan><tspan x=\"1090\" dy=\"33\">bỏ qua Governance</tspan></text></svg></div><footer class=\"source-note\">Nguồn: <a href=\"../Bo-thuyet-trinh/01-Hub-and-Spoke/tai-lieu-goc.pdf#page=65\" target=\"_blank\" rel=\"noopener\">Muhammad Awais (2026), tr. 65–66, 101–102</a></footer></article>", "<article><header><h2>ST-3: cổng quản trị chặn khóa bí mật viết cứng</h2><p class=\"lead\">Governance tạo điều kiện chấp nhận story, thay vì chỉ ghi nhận lỗi sau khi bàn giao.</p></header><div class=\"content\">\n<div class=\"incident-head\"><span class=\"incident-id\">ST-3</span><div><span class=\"evidence-label\">SỰ CỐ ĐƯỢC LUẬN VĂN GHI NHẬN</span><h3>Hardcoded secret key</h3><p>PM Governance phát hiện vấn đề bảo mật và chặn story.</p></div><b class=\"gov-fail-tag\">GOV FAIL</b></div>\n<div class=\"incident-flow\"><section><span>01 · TRIỂN KHAI</span><h3>Dev tạo mã</h3><p>Khóa bí mật nằm trực tiếp trong mã nguồn.</p></section><div class=\"incident-arrow\">→</div><section><span>02 · KIỂM TRA</span><h3>Governance chặn</h3><p>Story phải quay lại sửa, chưa được chấp nhận.</p></section><div class=\"incident-arrow\">→</div><section><span>03 · SỬA &amp; NỘP LẠI</span><h3>Kiểm tra lại</h3><p>Developer sửa; QA và Governance đánh giá lại.</p></section></div>\n<div class=\"fix-example\"><b>MINH HỌA CÁCH SỬA ĐỀ XUẤT</b><code>SECRET_KEY = \"...\" <span>→</span> os.environ[\"SECRET_KEY\"]</code><p>Tách secret khỏi mã, cấp qua môi trường hoặc secret manager.</p></div>\n\n</div><footer class=\"source-note\">Nguồn: <a href=\"../Bo-thuyet-trinh/01-Hub-and-Spoke/tai-lieu-goc.pdf#page=82\" target=\"_blank\" rel=\"noopener\">Muhammad Awais (2026), tr. 82, 107</a>; ví dụ cấp secret qua môi trường: minh họa của người trình bày.</footer></article>", "<article><header><h2>Ba mức kiểm soát</h2></header><div class=\"content\">\n<div class=\"mode-grid\">\n<section><div class=\"mode-tag\">OFF</div><h3>Không kiểm tra quản trị</h3><ul><li class=\"yes\">QA có trong kết quả chạy</li><li class=\"no\">Không có cổng Governance</li></ul></section>\n<section><div class=\"mode-tag\">BASIC</div><h3>Kiểm tra cơ bản</h3><ul><li class=\"yes\">Chức năng cơ bản</li><li class=\"yes\">Sự hiện diện của kiểm thử</li></ul></section>\n<section><div class=\"mode-tag\">STRICT</div><h3>Kiểm tra chặt hơn</h3><ul><li class=\"yes\">Kiểm tra cơ bản</li><li class=\"yes\">Bảo mật và kiến trúc</li></ul></section>\n</div>\n</div><footer class=\"source-note\">Nguồn: <a href=\"../Bo-thuyet-trinh/01-Hub-and-Spoke/tai-lieu-goc.pdf#page=70\" target=\"_blank\" rel=\"noopener\">Muhammad Awais (2026), tr. 70, 75–81, 102–103</a></footer></article>", "<article><header><h2>Cùng yêu cầu, phạm vi đầu ra khác nhau</h2></header><div class=\"content\">\n<div class=\"epic-label\">“Tạo trang đăng nhập có xác thực email”</div>\n<div class=\"metric-grid\"><section><h3>OFF</h3><strong>2</strong><p>story được tạo</p><small>2 frontend · 0 backend</small><div class=\"completion\">Hoàn tất 1 / 2</div></section>\n<section><h3>BASIC</h3><strong>5</strong><p>story được tạo</p><small>3 frontend · 2 backend</small><div class=\"completion\">Hoàn tất 5 / 5</div></section>\n<section><h3>STRICT</h3><strong>6</strong><p>story được tạo</p><small>3 frontend · 3 backend</small><div class=\"completion\">Hoàn tất 6 / 6</div></section></div>\n</div><footer class=\"source-note\">Nguồn: <a href=\"../Bo-thuyet-trinh/01-Hub-and-Spoke/tai-lieu-goc.pdf#page=74\" target=\"_blank\" rel=\"noopener\">Muhammad Awais (2026), tr. 74–81, Bảng 1–4</a></footer></article>", "<article><header><h2>Ba chỉ số qua ví dụ STRICT</h2></header><div class=\"content\">\n<div class=\"metric-grid\"><section><h3>AV · Thông lượng</h3><strong>24,71</strong><p>features / giờ</p><div class=\"calc\">6 story ÷ (874,30 giây / 3.600)< a></footer></article>", "<article><header><h2>Đánh giá kết quả và giới hạn</h2></header><div class=\"content\">\n<div class=\"review-comparison\"><section><span>BẰNG CHỨNG TRONG LAB</span><h3>Kiểm soát được luồng tác tử</h3><p>BASIC có AV cao nhất; STRICT phát hiện lỗi logic và khóa bí mật viết cứng.</p><p>STRICT ghi nhận GO 2,28 phút và Governance Pass Rate 100%.</p></section><section><span>GIỚI HẠN SO SÁNH</span><h3>Phạm vi và điều kiện khác nhau</h3><p>Các chế độ tạo số story khác nhau. Phỏng vấn doanh nghiệp không cùng điều kiện lab.</p><p>Mức tăng tốc ≈3.000 lần do tác giả nêu chưa xác lập hệ số áp dụng chung.</p></section></div>\n<div class=\"reproduction-callout\"><span>HẠN CHẾ TÁI LẬP</span><h3>PDF chưa cung cấp liên kết GitHub repo của nguyên mẫu</h3><p>Thiếu mã đầy đủ, cấu hình và log gốc khiến việc tái lập toàn bộ khó khăn.</p></div>\n</div><footer class=\"source-note\">Đánh giá của người trình bày dựa trên <a href=\"../Bo-thuyet-trinh/01-Hub-and-Spoke/tai-lieu-goc.pdf#page=74\" target=\"_blank\" rel=\"noopener\">Muhammad Awais (2026), tr. 74–95, 96–104</a>.</footer></article>", "<article><header><h2>Kết luận theo RQ1 và RQ2</h2></header><div class=\"content\">\n<div class=\"research-questions\"><section><span>RQ1 · QUẢN TRỊ TÁC TỬ</span><h3>Điều phối và cổng kiểm tra</h3><p>Coordinator quản lý bàn giao. QA và Governance kiểm tra, trả phản hồi và yêu cầu sửa trước khi chấp nhận story.</p></section><section><span>RQ2 · TỰ CHỦ VÀ CHẤT LƯỢNG</span><h3>Đánh đổi theo mức kiểm soát</h3><p>BASIC có thông lượng cao nhất. STRICT tăng kiểm tra và phát hiện lỗi, với GO khoảng 2,28 phút trong lần chạy.</p></section></div>\n</div><footer class=\"source-note\">Nguồn: <a href=\"../Bo-thuyet-trinh/01-Hub-and-Spoke/tai-lieu-goc.pdf#page=93\" target=\"_blank\" rel=\"noopener\">Muhammad Awais (2026), tr. 93–95, 105–108</a></footer></article>"];
    let current = 0;


    function render() {
      const container = document.getElementById("slide-viewport");
      container.innerHTML = slides[current];
      container.dataset.slide = current + 1;
      container.classList.remove("slide-anim");
      void container.offsetWidth; // Reflow
      container.classList.add("slide-anim");
      window.location.hash = current + 1;

      // Cập nhật số trang nhỏ ở góc dưới màn hình
      const pageNumEl = document.getElementById("slide-number");
      if (pageNumEl) {
        pageNumEl.textContent = (current + 1) + " / " + slides.length;
      }
    }

    function next() {
      if (current < slides.length - 1) {
        current++;
        render();
      }
    }

    function prev() {
      if (current > 0) {
        current--;
        render();
      }
    }

    function jumpTo(pageNumber) {
      if (pageNumber >= 1 && pageNumber <= slides.length) {
        current = pageNumber - 1;
        render();
      }
    }

    // CƠ CHẾ NHẢY TRANG BÍ MẬT KIỂU POWERPOINT: [GÕ SỐ] + [ENTER]
    let pageBuffer = "";
    let bufferTimer = null;

    function updateBufferIndicator() {
      const el = document.getElementById("jump-indicator");
      if (el) {
        if (pageBuffer) {
          el.textContent = pageBuffer;
          el.style.opacity = "0.08";
        } else {
          el.style.opacity = "0";
        }
      }
    }

    function clearBuffer() {
      pageBuffer = "";
      updateBufferIndicator();
      if (bufferTimer) clearTimeout(bufferTimer);
      bufferTimer = null;
    }

    // BẮT PHÍM ĐIỀU HƯỚNG & NHẬP SỐ BÍ MẬT
    document.addEventListener("keydown", (e) => {
      // 1. Nhập số để nhảy trang bí mật (PowerPoint standard: gõ số rồi bấm Enter)
      if (e.key >= "0" && e.key <= "9") {
        pageBuffer += e.key;
        updateBufferIndicator();
        if (bufferTimer) clearTimeout(bufferTimer);
        bufferTimer = setTimeout(clearBuffer, 2500);
        return;
      }

      if (e.key === "Enter") {
        if (pageBuffer) {
          e.preventDefault();
          const target = parseInt(pageBuffer, 10);
          clearBuffer();
          jumpTo(target);
          return;
        }
      }

      if (e.key === "Escape" || e.key === "Backspace") {
        if (pageBuffer) {
          clearBuffer();
          return;
        }
      }

      // 2. Phím F để bật/tắt toàn màn hình thuận tiện khi trình chiếu
      if ((e.key === "f" || e.key === "F") && !pageBuffer) {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }

      // 3. Phím điều hướng tiêu chuẩn
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
        e.preventDefault();
        clearBuffer();
        next();
      } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        e.preventDefault();
        clearBuffer();
        prev();
      } else if (e.key === "Home") {
        e.preventDefault();
        clearBuffer();
        jumpTo(1);
      } else if (e.key === "End") {
        e.preventDefault();
        clearBuffer();
        jumpTo(slides.length);
      }
    });

    // CLICK NỬA PHẢI ĐỂ TIẾN, NỬA TRÁI ĐỂ LÙI
    document.addEventListener("click", (e) => {
      if (e.target.closest("a")) return;
      if (e.clientX > window.innerWidth / 2) {
        next();
      } else {
        prev();
      }
    });

    // ĐỒNG BỘ URL HASH (ví dụ: gõ trực tiếp #15 vào thanh địa chỉ để nhảy tới trang 15)
    window.addEventListener("hashchange", () => {
      const page = parseInt(window.location.hash.replace("#", ""), 10);
      if (page >= 1 && page <= slides.length && page - 1 !== current) {
        current = page - 1;
        render();
      }
    });

    // Đọc số trang từ URL hash khi tải trang
    if (window.location.hash) {
      const initialPage = parseInt(window.location.hash.replace("#", ""), 10);
      if (initialPage >= 1 && initialPage <= slides.length) {
        current = initialPage - 1;
      }
    }
