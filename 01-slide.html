er><h2>Bốn chế độ làm việc</h2><p class=lead>Mức tự chủ thay đổi theo nhiệm vụ và rủi ro khi giao việc cho AI</p></header><div class=\"content\"><table class=\"modes-table\"><colgroup><col style=\"width:26%\"><col style=\"width:36%\"><col style=\"width:38%\"></colgroup><thead><tr><th>Chế độ</th><th>AI Agent thực hiện</th><th>Con người tham gia</th></tr></thead><tbody>\n<tr><td><b>Guided AI-Autonomy</b><small>Ghi chú, nhắc việc</small></td><td>Thực hiện nhiệm vụ đơn giản theo hướng dẫn.</td><td>Giao hướng dẫn và xem xét kết quả cuối.</td></tr>\n<tr><td><b>Supervised-AI</b><small>Email, báo cáo</small></td><td>Soạn nháp, hỏi lại và chỉnh sửa.</td><td>Phản hồi, phê duyệt trước khi thực hiện đầy đủ.</td></tr>\n<tr><td><b>Human-AI Collaborative</b><small>Sprint planning, ước lượng</small></td><td>Phân tích dữ liệu, đóng góp phương án.</td><td>PM và cả nhóm thảo luận, cùng ra quyết định.</td></tr>\n<tr><td><b>AI-Assisted</b><small>Kế hoạch tổng thể, đàm phán</small></td><td>Phân tích và gợi ý khi được yêu cầu.</td><td>PM chủ trì, xem xét và quyết định.</td></tr></tbody></table></div><footer class=\"source-note\">Nguồn: <a href=\"tai-lieu-goc.pdf#page=4\" target=\"_blank\" rel=\"noopener\">Assalaarachchi và cộng sự (2026), tr. 4–6, mục 3.2.1, Bảng 1</a></footer></article>", "<article class=\"\"><header><h2>Chọn chế độ theo độ phức tạp và rủi ro</h2></header><div class=\"content\"><div class=\"visual-split mapping\"><figure><img src=\"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAA5wAAAKQCAYAAADzB3UeAAEAAElEQVR4nOydCZxN9f//jxY7KWTLvm9ZSvYlS5R9qWQNKVRSKJQlFJJUlkglCpWdKDsJWbJE9kola4WyRMv5P57v7+9z/ueeuXfm3mvG3Lnzfj4ed2buuWf5nM85587n9XlvKWzbti1FURRFURRFURRFiWeui+8dKoqiKIqiKIqiKIoKTkVRFEVRFEVRFCXBUAunoiiKoiiKoiiKkiCo4FQURVEURVEURVESBBWciqIoiqIoiqIoSoKgglNRFEVRFEVRFEVJEFRwKoqiKIqiKIqiKAmCCk5FURRFURRFURQlQVDBqSiKoiiKoiiKoiQIKjgVRVEURVEURVGUBEEFp6IoiqIoiqIoipIgqOBUFEVRFEVRFEVREgQVnIqiKIqiKIqiKEqCoIJTURRFURRFURRFSRBUcCqKoiiKoiiKoigJggpORVEURVEURVEUJUFQwakoiqIoiqIoiqIkCCo4FUVRFEVRFEV EEEIIIYRICzI4hRBCCCGEEEKkBRmcQgghhBBCCCFi6eD/AHxedrVibfnBAAAAAElFTkSuQmCC\" alt=\"Hình 3 nguyên bản: mức tự chủ của Agentic PM giảm khi độ phức tạp và rủi ro nhiệm vụ tăng\"></figure><aside>\n<section><h3>Nhiệm vụ ít rủi ro</h3><p>Có thể giao AI mức tự chủ cao hơn, vẫn cần xem xét kết quả.</p></section>\n<section><h3>Nhiệm vụ có ảnh hưởng lớn</h3><p>Tăng sự tham gia của PM và giới hạn quyền tự quyết của AI.</p></section>\n<section><h3>Phân loại theo tình huống</h3><p>Một nhiệm vụ có thể thuộc nhiều chế độ tùy quy mô và bối cảnh dự án.</p></section></aside></div></div><footer class=\"source-note\">Nguồn: <a href=\"tai-lieu-goc.pdf#page=5\" target=\"_blank\" rel=\"noopener\">Assalaarachchi và cộng sự (2026), tr. 5, Hình 3 và chú thích 7</a></footer></article>", "<article class=\"\"><header><h2>AI Agent hỗ trợ lập kế hoạch</h2></header><div class=\"content\">\n<div class=\"planning-pair\"><section><div class=\"section-label\">KẾ HOẠCH TỔNG THỂ</div><h3>AI-Assisted</h3><p>Agent phân tích dữ liệu dự án, cung cấp thông tin để PM xây dựng kế hoạch.</p><div class=\"responsibility\"><b>PM chủ trì</b><p>Xem xét tính khả thi và ảnh hưởng đến toàn dự án.</p></div></section>\n<section><div class=\"section-label\">KẾ HOẠCH SPRINT</div><h3>Human-AI Collaborative</h3><p>Agent phân tích user story và dữ liệu quá khứ, đề xuất story cho sprint và ước lượng story point.</p><div class=\"responsibility\"><b>Nhóm cùng quyết định</b><p>Đối chiếu năng lực, kỹ năng và khối lượng công việc thực tế.</p></div></section></div>\n<div class=\"output-line\"><b>Thông tin cần xem xét</b><span>User stories</span><span>Dữ liệu dự án trước</span><span>Năng lực của nhóm</span></div></div><footer class=\"source-note\">Nguồn: <a href=\"tai-lieu-goc.pdf#page=5\" target=\"_blank\" rel=\"noopener\">Assalaarachchi và cộng sự (2026), tr. 5–6, mục 3.2.1, Bảng 1</a></footer></article>", "<article class=\"\"><header><h2>Phân tích rủi ro dự án với Risk Analysis Agent</h2><p class=lead>Bài báo nêu tác tử phân tích rủi ro trong kiến trúc, chưa mô tả thuật toán đánh giá riêng</p></header><div class=\"content\">\n<div class=\"application-label\">MINH HỌA ÁP DỤNG CHO ĐỀ TÀI</div>\n<div class=\"scenario\"><b>Tình huống</b><p>Dự án website đặt lịch có 4 thành viên. Sprint tiếp theo phụ thuộc API thanh toán chưa được bàn giao.</p></div>\n<table class=\"risk-table\"><colgroup><col style=\"width:23%\"><col style=\"width:36%\"><col style=\"width:41%\"></colgroup><thead><tr><th>Dấu hiệu đầu vào</th><th>Agent phân tích, đề xuất</th><th>PM xem xét, quyết định</th></tr></thead><tbody>\n<tr><td>API chưa sẵn sàng</td><td>Nguy cơ chậm tích hợp.<br>Đề xuất dùng mock API tạm thời.</td><td>Xác nhận lịch bàn giao và điều chỉnh thứ tự công việc.</td></tr>\n<tr><td>Một thành viên phụ trách nhiều việc</td><td>Nguy cơ quá tải.<br>Đề xuất chia lại nhiệm vụ.</td><td>Kiểm tra năng lực và phân công lại.</td></tr>\n<tr><td>Yêu cầu tiếp tục thay đổi</td><td>Nguy cơ vượt phạm vi.<br>Đề xuất làm rõ tiêu chí chấp nhận.</td><td>Thống nhất phạm vi với các bên liên quan.</td></tr></tbody></table></div><footer class=\"source-note\">Nguồn: <a href=\"tai-lieu-goc.pdf#page=5\" target=\"_blank\" rel=\"noopener\">Assalaarachchi và cộng sự (2026), tr. 4–5, mục 3.2; tình huống minh họa của người trình bày</a></footer></article>", "<article class=\"\"><header><h2>Vai trò của PM con người</h2></header><div class=\"content\">\n<div class=\"role-intro\"><h3>Người dẫn dắt chiến lược và huấn luyện đội ngũ</h3><p>PM giao nhiệm vụ, chọn chế độ làm việc, xem xét kết quả và có thể dừng tác tử khi cần.</p></div>\n<div class=\"skills\"><section><b>01</b><div><h3>Đọc hiểu dữ liệu</h3><p>Kiểm tra và diễn giải kết quả agent đưa ra.</p></div></section><section><b>02</b><div><h3>Giám sát đạo đức</h3><p>Kiểm soát quyền riêng tư, việc chia sẻ dữ liệu.</p></div></section><section><b>03</b><div><h3>Tư duy phản biện</h3><p>Đánh giá phương án, rủi ro và mức tự chủ phù hợp.</p></div></section><section><b>04</b><div><h3>Kỹ năng làm việc với con người</h3><p>Giao tiếp, đàm phán và giải quyết xung đột.</p></div></section></div></div><footer class=\"source-note\">Nguồn: <a href=\"tai-lieu-goc.pdf#page=6\" target=\"_blank\" rel=\"noopener\">Assalaarachchi và cộng sự (2026), tr. 6–7, mục 3.3</a></footer></article>", "<article class=\"\"><header><h2>Đóng góp và giới hạn của bài báo</h2></header><div class=\"content\">\n<div class=\"assessment\"><section><div class=\"section-label\">ĐÓNG GÓP</div><h3>Khung thiết kế Agentic PM</h3><ul><li>Lộ trình SPM với AI.</li><li>Kiến trúc phối hợp đa tác tử.</li><li>Bốn chế độ tự chủ và vai trò của PM.</li></ul></section>\n<section><div class=\"section-label\">GIỚI HẠN</div><h3>Chưa có kiểm chứng thực nghiệm</h3><ul><li>Đề xuất ban đầu, chưa báo cáo kết quả thử nghiệm hệ thống.</li><li>Ánh xạ chế độ mới xét độ phức tạp và rủi ro.</li><li>Bài báo không cung cấp liên kết mã nguồn triển khai.</li></ul></section></div>\n<div class=\"evidence-line\"><b>Giá trị cho đề tài</b><p>Cơ sở xây dựng mô hình trợ lý. Hiệu quả lập kế hoạch và phân tích rủi ro cần được kiểm thử bằng prototype.</p></div></div><footer class=\"source-note\">Nguồn: <a href=\"tai-lieu-goc.pdf#page=7\" target=\"_blank\" rel=\"noopener\">Assalaarachchi và cộng sự (2026), tr. 7, mục 4 và 6; toàn văn về liên kết triển khai</a></footer></article>", "<article class=\"\"><header><h2>Hướng nghiên cứu tiếp theo của tác giả</h2></header><div class=\"content\">\n<div class=\"research-pair\"><section><div class=\"section-label\">KIỂM CHỨNG MÔ HÌNH</div><h3>Khảo sát và phỏng vấn người làm dự án</h3><p>Xác định nhiệm vụ phù hợp với từng chế độ và các yếu tố ảnh hưởng đến việc giao nhiệm vụ.</p><h3 class=\"next-heading\">Xây dựng prototype, thử với nhóm phát triển</h3><p>Đánh giá cách phối hợp giữa PM, thành viên và tác tử.</p></section>\n<section><div class=\"section-label\">CÁC HƯỚNG MỞ RỘNG</div><ul class=\"research-list\"><li>Yếu tố chấp nhận Agentic PM.</li><li>Trải nghiệm của thành viên nhóm.</li><li>Ứng dụng trong Scrum và Agile.</li><li>Hướng dẫn phát triển, sử dụng có trách nhiệm.</li><li>Ảnh hưởng đến PM mới vào nghề.</li><li>Cập nhật đào tạo quản lý dự án.</li></ul></section></div></div><footer class=\"source-note\">Nguồn: <a href=\"tai-lieu-goc.pdf#page=7\" target=\"_blank\" rel=\"noopener\">Assalaarachchi và cộng sự (2026), tr. 7, mục 4–5</a></footer></article>", "<article class=\"\"><header><h2>Phạm vi demo cho bài tập lớn</h2></header><div class=\"content\">\n<div class=\"application-label\">ĐỀ XUẤT TRIỂN KHAI CỦA NHÓM</div>\n<div class=\"demo-head\"><h3>Một dự án phần mềm, hai tác tử chuyên trách</h3><p>Đầu vào: yêu cầu dự án, backlog, thời hạn và năng lực thành viên.</p></div>\n<div class=\"demo-steps\"><section><span>01</span><h3>Planning Agent</h3><p>Đề xuất chia việc, phụ thuộc và kế hoạch sprint.</p></section><section><span>02</span><h3>Risk Analysis Agent</h3><p>Phân tích nguy cơ chậm tiến độ, quá tải và thay đổi phạm vi từ kế hoạch.</p></section><section><span>03</span><h3>PM xem xét</h3><p>Chấp nhận, chỉnh sửa hoặc yêu cầu phân tích lại phương án.</p></section></div>\n<div class=\"output-line\"><b>Đầu ra</b><span>Kế hoạch sprint</span><span>Danh sách rủi ro có căn cứ</span><span>Phương án ứng phó</span></div>\n<p class=\"demo-eval\"><b>Đánh giá:</b> tính khả thi của kế hoạch, rủi ro bị bỏ sót, đề xuất thiếu căn cứ và thời gian hỗ trợ.</p></div><footer class=\"source-note\">Nguồn: <a href=\"tai-lieu-goc.pdf#page=5\" target=\"_blank\" rel=\"noopener\">Assalaarachchi và cộng sự (2026), tr. 4–7, kiến trúc và giới hạn; phạm vi demo do nhóm đề xuất</a></footer></article>", "<article class=\"\"><header><h2>Kết luận</h2></header><div class=\"content\">\n<div class=\"conclusions\"><section><span>01</span><div><h3>AI Agent hỗ trợ PM qua kiến trúc đa tác tử</h3><p>Tác tử điều phối kết nối các tác tử chuyên trách, dữ liệu dự án và phản hồi của con người.</p></div></section>\n<section><span>02</span><div><h3>Lập kế hoạch cần mức tham gia phù hợp</h3><p>PM chủ trì kế hoạch tổng thể. Sprint planning cần sự phối hợp của cả nhóm.</p></div></section>\n<section><span>03</span><div><h3>Phân tích rủi ro là trọng tâm cần triển khai, kiểm thử</h3><p>Đề tài có thể phát triển prototype tập trung vào kế hoạch và rủi ro, dựa trên khung thiết kế của bài báo.</p></div></section></div></div><footer class=\"source-note\">Nguồn: <a href=\"tai-lieu-goc.pdf#page=7\" target=\"_blank\" rel=\"noopener\">Assalaarachchi và cộng sự (2026), tr. 5–7, mục 3.2, 4, 6; định hướng áp dụng của nhóm</a></footer></article>"];
let current = 0;


    function render() {
      const container = document.getElementById("slide-viewport");
      container.innerHTML = slides[current];
      container.dataset.slide = current + 1;
      container.classList.remove("slide-anim");
      void container.offsetWidth; // Reflow
      container.classList.add("slide-anim");
      window.location.hash = current + 1;

      // Cập nhật số trang nhỏ ở góc dưới màn hình
      const pageNumEl = document.getElementById("slide-number");
      if (pageNumEl) {
        pageNumEl.textContent = (current + 1) + " / " + slides.length;
      }
    }

    function next() {
      if (current < slides.length - 1) {
        current++;
        render();
      }
    }

    function prev() {
      if (current > 0) {
        current--;
        render();
      }
    }

    function jumpTo(pageNumber) {
      if (pageNumber >= 1 && pageNumber <= slides.length) {
        current = pageNumber - 1;
        render();
      }
    }

    // CƠ CHẾ NHẢY TRANG BÍ MẬT KIỂU POWERPOINT: [GÕ SỐ] + [ENTER]
    let pageBuffer = "";
    let bufferTimer = null;

    function updateBufferIndicator() {
      const el = document.getElementById("jump-indicator");
      if (el) {
        if (pageBuffer) {
          el.textContent = pageBuffer;
          el.style.opacity = "0.08";
        } else {
          el.style.opacity = "0";
        }
      }
    }

    function clearBuffer() {
      pageBuffer = "";
      updateBufferIndicator();
      if (bufferTimer) clearTimeout(bufferTimer);
      bufferTimer = null;
    }

    // BẮT PHÍM ĐIỀU HƯỚNG & NHẬP SỐ BÍ MẬT
    document.addEventListener("keydown", (e) => {
      // 1. Nhập số để nhảy trang bí mật (PowerPoint standard: gõ số rồi bấm Enter)
      if (e.key >= "0" && e.key <= "9") {
        pageBuffer += e.key;
        updateBufferIndicator();
        if (bufferTimer) clearTimeout(bufferTimer);
        bufferTimer = setTimeout(clearBuffer, 2500);
        return;
      }

      if (e.key === "Enter") {
        if (pageBuffer) {
          e.preventDefault();
          const target = parseInt(pageBuffer, 10);
          clearBuffer();
          jumpTo(target);
          return;
        }
      }

      if (e.key === "Escape" || e.key === "Backspace") {
        if (pageBuffer) {
          clearBuffer();
          return;
        }
      }

      // 2. Phím F để bật/tắt toàn màn hình thuận tiện khi trình chiếu
      if ((e.key === "f" || e.key === "F") && !pageBuffer) {
        if (!document.fullscreenElement) {
          document.documentElement.requestFullscreen().catch(() => {});
        } else {
          document.exitFullscreen().catch(() => {});
        }
      }

      // 3. Phím điều hướng tiêu chuẩn
      if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") {
        e.preventDefault();
        clearBuffer();
        next();
      } else if (e.key === "ArrowLeft" || e.key === "PageUp") {
        e.preventDefault();
        clearBuffer();
        prev();
      } else if (e.key === "Home") {
        e.preventDefault();
        clearBuffer();
        jumpTo(1);
      } else if (e.key === "End") {
        e.preventDefault();
        clearBuffer();
        jumpTo(slides.length);
      }
    });

    // CLICK NỬA PHẢI ĐỂ TIẾN, NỬA TRÁI ĐỂ LÙI
    document.addEventListener("click", (e) => {
      if (e.target.closest("a,button,input,textarea,select")) return;
      if (e.clientX > window.innerWidth / 2) {
        next();
      } else {
        prev();
      }
    });

    // ĐỒNG BỘ URL HASH (ví dụ: gõ trực tiếp #15 vào thanh địa chỉ để nhảy tới trang 15)
    window.addEventListener("hashchange", () => {
      const page = parseInt(window.location.hash.replace("#", ""), 10);
      if (page >= 1 && page <= slides.length && page - 1 !== current) {
        current = page - 1;
        render();
      }
    });

    // Đọc số trang từ URL hash khi tải trang
    if (window.location.hash) {
      const initialPage = parseInt(window.location.hash.replace("#", ""), 10);
      if (initialPage >= 1 && initialPage <= slides.length) {
        current = initialPage - 1;
      }
    }

function fitSlide(){document.documentElement.style.setProperty('--slide-scale',Math.min(innerWidth/1440,innerHeight/900));}addEventListener('resize',fitSlide);fitSlide();render();
